buildscript {
    repositories {
        gradlePluginPortal()
    }

    dependencies {
        classpath "com.github.node-gradle:gradle-node-plugin:7.1.0"
    }
}

apply plugin: 'com.github.node-gradle.node';
apply plugin: 'base';

String testsExecutedMarkerName = "${projectDir}/.tests.executed";

// Here we configure the current NodeJS version.
node {
    // We set current NodeJS Version.
    version = '24.21.0';
    // We set current NPM Version.
    npmVersion = '11.21.0';
    npmInstallCommand = 'ci';
    // We tell the plug-in whether we should download the NodeJS Binaries or not.
    download = true;
}

npmInstall { args = ['--no-audit', '--no-fund'] }

npm_run_build {
    inputs.file 'index.html'
    inputs.files fileTree('.storybook')
    environment = ['NODE_OPTIONS': '--max-old-space-size=768', 'RAYON_NUM_THREADS': '2']
    inputs.files fileTree("public")
    inputs.files fileTree("src")

    inputs.file 'package.json'
    inputs.file 'package-lock.json'
    inputs.file 'tsconfig.json'
    inputs.file 'vite.config.ts'
    inputs.file 'eslint.config.js'

    outputs.dir 'build'
    outputs.dir 'build-reports'
}

task packageNpmApp(type: Zip) {
    dependsOn npm_run_build;
    archiveBaseName = 'authorization-website';
    archiveExtension = 'jar';
    destinationDirectory = file("${projectDir}/build_packageNpmApp");
    from('build') {
        into 'static';
    };
}

configurations {
    npmResources
}

configurations.getByName('default').extendsFrom(configurations.npmResources);

artifacts {
    npmResources(packageNpmApp.archiveFile) {
        builtBy packageNpmApp
        type 'jar';
    }
}

assemble.dependsOn packageNpmApp;

clean {
    delete packageNpmApp.archiveFile
    delete file("${projectDir}/build_packageNpmApp")
    delete testsExecutedMarkerName
}

tasks.register('release') {
    dependsOn tasks.test
    dependsOn tasks.build
}

task test(type: NpmTask) {
    dependsOn assemble

    args = ['run', 'test']

    inputs.files fileTree('src')
    inputs.file 'vite.config.ts'
    inputs.file 'tsconfig.json'
    inputs.file 'package.json'
    inputs.file 'package-lock.json'

    // allows easy triggering re-tests
    doLast {
        new File(testsExecutedMarkerName).text = 'delete this file to force re-execution JavaScript tests'
    }
    outputs.file testsExecutedMarkerName
}

check.dependsOn test

// Verify component documentation independently from the website packaged in Spring.
tasks.register('buildStorybook', NpmTask) {
    dependsOn npmInstall
    args = ['run', 'build-storybook']
    environment = ['NODE_OPTIONS': '--max-old-space-size=768', 'RAYON_NUM_THREADS': '2']
    inputs.files fileTree('src')
    inputs.files fileTree('.storybook')
    inputs.file 'package.json'
    inputs.file 'package-lock.json'
    inputs.file 'vite.config.ts'
    outputs.dir 'storybook-static'
}

// Check the entire locked tree, including tooling, rather than suppressing dev advisories.
tasks.register('auditDependencies', NpmTask) {
    dependsOn npmInstall
    args = ['run', 'audit']
}
check.dependsOn auditDependencies
