plugins {
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'java'
    id 'org.flywaydb.flyway' version '12.0.2'
    id 'checkstyle'
    id 'jacoco'
}

group = 'com.mchan'
version = '0.0.1-SNAPSHOT'
java { toolchain { languageVersion = JavaLanguageVersion.of(25) } }

configurations {
    flywayMigration
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter:4.1.0'
    implementation 'commons-validator:commons-validator:1.10.1'
    implementation project(':authorization-service-shared-lib')
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.1.1'

    compileOnly 'org.projectlombok:lombok'
    runtimeOnly 'org.postgresql:postgresql'
    flywayMigration 'org.flywaydb:flyway-database-postgresql:12.0.2'
    runtimeOnly project(':authorization-website')

    annotationProcessor 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'

    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-restclient-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'io.github.benas:random-beans:3.7.0'
}

test {
    systemProperty 'spring.profiles.active', 'dev'
    useJUnitPlatform()
    exclude "**/RetentionDatabaseTests.class"
    finalizedBy jacocoTestReport
}

flyway {
    //  Dev Config
//    url = 'jdbc:postgresql://localhost:5432/postgres'
//    user = 'flyway_user'
//    password = 'flyway-user-password'

    // To use when in Cloud Provider.
    url = System.getenv().get('JDBC_DATABASE_URL')
    user = System.getenv().get('JDBC_DATABASE_USERNAME')
    password = System.getenv().get('JDBC_DATABASE_PASSWORD')

    configurations = ['runtimeClasspath', 'flywayMigration']
    schemas = ['auth_db']
}

checkstyle {
    toolVersion = '12.3.0'
    ignoreFailures = false
    maxWarnings = 0
}

tasks.register('checkstyle') {
    dependsOn tasks.checkstyleMain
    dependsOn tasks.checkstyleTest
}

tasks.getByName('checkstyle').outputs.upToDateWhen { false }

tasks.register('release') {
    dependsOn tasks.checkstyle
    dependsOn tasks.test
    dependsOn tasks.build
    finalizedBy 'copyJar'
}

tasks.register('copyJar', Copy) {
    from "$buildDir/libs/authorization-service-0.0.1-SNAPSHOT.jar"
    into layout.projectDirectory.dir('../build')
}

jacoco {
    toolVersion = '0.8.14'
    reportsDirectory.set(file("$buildDir/jacoco"))
}

test.outputs.upToDateWhen { false }
jacocoTestReport.outputs.upToDateWhen { false }

jacocoTestCoverageVerification {
    violationRules {
        rule {
            limit {
                minimum = 0.9
            }
        }
    }
}

jacocoTestReport {
    dependsOn test
    afterEvaluate {
        classDirectories.setFrom(files(classDirectories.files.collect {
            fileTree(dir: it, exclude: [
                    '**/models/**',
                    '**/exceptions/**',
                    '**/dto/**',
                    '**/dao/entities/**',
                    '**/spring/config/**',
                    '**/AuthorizationServiceApplication*',
                    '**/EntitiesAuthenticationToken*',
                    '**/WebSecurityConfig*'
            ])
        }))
    }
}

// Real PostgreSQL tests run only against an owned, disposable database.
tasks.register('retentionTest', Test) {
    dependsOn testClasses
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform()
    include '**/RetentionDatabaseTests.class'
    outputs.upToDateWhen { false }
    maxParallelForks = 1
    testLogging.showStandardStreams = true
    doFirst {
        if (!System.getenv('RETENTION_TEST_URL')?.startsWith('jdbc:postgresql://127.0.0.1:')) {
            throw new GradleException('Run tools/validation/retention.py to create a disposable database')
        }
    }
}
