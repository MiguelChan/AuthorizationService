spring.profiles.default=prod
# ContextPaths are for High-level URL's
server.error.whitelabel.enabled=false
mybatis.mapper-locations=mybatis/mappers/**/*.xml
app.pepper.value=${SALT_VALUE}
app.bcrypt.iterations=${BCRYPT_ITERATIONS}
spring.jackson.default-property-inclusion = NON_NULL

app.oauth.issuer=${OAUTH_ISSUER}
app.oauth.token-ttl-seconds=300
app.oauth.allow-insecure-localhost=false

app.security.allowed-origins=${CORS_ALLOWED_ORIGINS:}
server.servlet.session.timeout=15m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict

springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

app.security.require-https=true
app.limits.max-body-bytes=16384
app.limits.max-concurrent=1024
app.limits.global-rps=5000
app.limits.client-rps=2000
spring.threads.virtual.enabled=true
server.tomcat.max-connections=2048
server.tomcat.accept-count=64
server.tomcat.connection-timeout=2s
server.tomcat.keep-alive-timeout=15s
server.tomcat.max-http-form-post-size=16KB
server.tomcat.max-swallow-size=0
server.max-http-request-header-size=16KB
spring.datasource.hikari.maximum-pool-size=32
spring.datasource.hikari.minimum-idle=32
spring.datasource.hikari.connection-timeout=1000
spring.datasource.hikari.validation-timeout=500
spring.datasource.hikari.data-source-properties.socketTimeout=3
spring.datasource.hikari.data-source-properties.options=-c statement_timeout=2000 -c lock_timeout=500
spring.transaction.default-timeout=3s
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=10s
