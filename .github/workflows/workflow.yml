name: AuthorizationService CI

on:
  push:
    branches:
      - mainline
  pull_request:
    branches:
      - mainline
      - u/miguel.chan/**
  workflow_dispatch:

jobs:
  build-service:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: .
    steps:
      - name: Checkout the Source Code
        uses: actions/checkout@v5
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '25'
      - name: Run release script
        run: ./gradlew release -Pskip-functional-tests --no-daemon --max-workers=1